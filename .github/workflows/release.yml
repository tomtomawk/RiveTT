name: release

# A version tag is the explicit release decision. The normal build workflow remains
# deliberately limited to CI: it does not publish binaries or mutate GitHub releases.
on:
  push:
    tags:
      - 'v*'

# Required for `gh release create` and for uploading the signed installer asset through
# the repository-scoped GITHUB_TOKEN. The signing key comes from repository secrets.
permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the .NET SDK pinned by global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # builder/build.ps1 detects ISCC.exe, but GitHub's base image does not
      # guarantee that Inno Setup is present. Install it explicitly so a missing
      # compiler can never turn a release into a successful run with no installer.
      - name: Install Inno Setup
        shell: pwsh
        run: >
          winget install --id JRSoftware.InnoSetup --exact --silent
          --accept-package-agreements --accept-source-agreements

      - name: Import the Thomas Thébault signing certificate
        shell: pwsh
        env:
          RIVETT_SIGN_PFX_BASE64: ${{ secrets.RIVETT_SIGN_PFX_BASE64 }}
          RIVETT_SIGN_PFX_PASSWORD: ${{ secrets.RIVETT_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RIVETT_SIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:RIVETT_SIGN_PFX_PASSWORD)) {
            throw 'Secrets RIVETT_SIGN_PFX_BASE64 et RIVETT_SIGN_PFX_PASSWORD requis.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'RiveTT-CodeSigning.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath, [Convert]::FromBase64String($env:RIVETT_SIGN_PFX_BASE64))
            $password = ConvertTo-SecureString $env:RIVETT_SIGN_PFX_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $certificate = $imported | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $certificate) { throw 'Le PFX ne contient aucune clé privée.' }
            $signer = $certificate.GetNameInfo(
              [Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($signer -ne 'Thomas Thébault') {
              throw "Mauvais signataire dans le PFX : '$signer'."
            }
            "RIVETT_SIGN_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }

      - name: Check that the tag matches the product version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props')).Project.PropertyGroup.Version
          if (-not $version) { throw 'Version introuvable dans Directory.Build.props.' }
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag '$env:GITHUB_REF_NAME' ne correspond pas a la version '$version'."
          }

      # Builds both Revit targets, runs the test suite, regenerates the staging tree
      # and invokes ISCC. The script fails if tests, signing or installer build fails.
      - name: Build the release installer
        shell: pwsh
        run: .\builder\build.ps1

      - name: Publish the GitHub release and installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content 'Directory.Build.props')).Project.PropertyGroup.Version
          $asset = "dist\RiveTT-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $asset)) {
            throw "Installateur introuvable : $asset"
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $asset --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $env:GITHUB_REF_NAME $asset --repo $env:GITHUB_REPOSITORY `
              --title "RiveTT $version" --generate-notes
          }
